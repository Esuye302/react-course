<!DOCTYPE html>
<html>
  <head>
    <title>chat Bot🤖</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const ChatInput = () => {
        return (
          <>
            <input
              type="text"
              placeholder="Sen a message to Chatbot"
              size="30"
            />
            <button>Send</button>
          </>
        );
      };
      const ChatMessage = (props) => {
        const { message, user } = props;
        if (user) {
          return (
            <div style={{ textAlign: "right" }}>
              {message}
              <img src="user.png" width="50" />
            </div>
          );
        }

        return (
          <div>
            {message}
            {user ? (
              <img src="user.png" width="50" />
            ) : (
              <img src="robot.png" width="50" />
            )}
          </div>
        );
      };
      const App = () => {
        return (
          <>
            <ChatInput />
            <ChatMessage message="hello Chatbot" user />
            <ChatMessage message="hello! How can i help you" />
            <ChatMessage message="can You get me todays Date" user />
            <ChatMessage message="Today is octaber 8,2025" />
          </>
        );
      };

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
