<!DOCTYPE html>
<html>
  <head>
    <title>chat Bot🤖</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script type="text/babel">
      const container = document.querySelector(".js-container");

      const ProductDetails = ({ name, price, discount, imgSrc }) => {
        return (
          <div
            style={{
              border: "1px solid gray",
              padding: "10px",
              margin: "10px",
              width: "200px",
            }}
          >
            <img src={imgSrc} width="50" alt="" />
            <p>{name}</p>
            {discount ? (
              <del>
                <p>price: ${price}</p>
              </del>
            ) : (
              <p>price: ${price}</p>
            )}
            {discount && <p>discount: ${discount}</p>}
            <button>Add to cart</button>
          </div>
        );
      };
      const App = () => {
        return (
          <div style={{ display: "flex" }}>
            <ProductDetails
              name="Cotton socks"
              price="10.90"
              discount="5.45"
              imgSrc="cotton-socks.png"
            />
            <ProductDetails
              name="Tennis balls"
              price="6.00"
              imgSrc="tennis-balls.png"
            />
            <ProductDetails
              name="plain T-shirt"
              price="7.99"
              imgSrc="plain-t-shirt.png"
            />
          </div>
        );
      };

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
